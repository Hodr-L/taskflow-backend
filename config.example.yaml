# TaskFlow 鍚庣閰嶇疆妯℃澘
# 澶嶅埗姝ゆ枃浠朵负 config.yaml 骞朵慨鏀归厤缃€?
# 鏁忔劅淇℃伅锛堝瘑鐮併€佸瘑閽ワ級搴旈€氳繃鐜鍙橀噺璁剧疆

app:
  name: "TaskFlow"
  version: "1.0.0"
  env: "development"  # development, testing, production
  debug: true  # 鐢熶骇鐜搴旇缃负 false

server:
  port: 30088  # 鍙€氳繃鐜鍙橀噺 SERVER_PORT 瑕嗙洊
  host: "0.0.0.0"  # 鐩戝惉鎵€鏈夊湴鍧€
  read_timeout: 10  # 绉?
  write_timeout: 10  # 绉?
  idle_timeout: 60  # 绉?
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    # 鐢熶骇鐜娣诲姞瀹為檯鍩熷悕

database:
  # MySQL 鏁版嵁搴撻厤缃?
  host: "localhost"  # 鍙€氳繃鐜鍙橀噺 DB_HOST 瑕嗙洊
  port: 53306  # 涓绘満绔彛锛堝鍣ㄥ唴涓?306锛夛紝鍙€氳繃鐜鍙橀噺 DB_PORT 瑕嗙洊
  name: "taskflow"  # 鏁版嵁搴撳悕锛屽彲閫氳繃鐜鍙橀噺 DB_NAME 瑕嗙洊
  user: "taskflow"  # 鏁版嵁搴撶敤鎴凤紝鍙€氳繃鐜鍙橀噺 DB_USER 瑕嗙洊
  password: ""  # 鈿狅笍 蹇呴』閫氳繃 DB_PASSWORD 鐜鍙橀噺璁剧疆
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_open_conns: 25  # 鏈€澶ц繛鎺ユ暟
  max_idle_conns: 5   # 绌洪棽杩炴帴鏁?
  conn_max_lifetime: 300  # 杩炴帴鏈€澶х敓瀛樻椂闂达紙绉掞級

redis:
  # Redis 缂撳瓨閰嶇疆
  host: "localhost"  # 鍙€氳繃鐜鍙橀噺 REDIS_HOST 瑕嗙洊
  port: 6379  # 鍙€氳繃鐜鍙橀噺 REDIS_PORT 瑕嗙洊
  password: ""  # 鈿狅笍 蹇呴』閫氳繃 REDIS_PASSWORD 鐜鍙橀噺璁剧疆
  db: 0  # Redis鏁版嵁搴撶紪鍙?
  pool_size: 10  # 杩炴帴姹犲ぇ灏?
  min_idle_conns: 2  # 鏈€灏忕┖闂茶繛鎺ユ暟

jwt:
  # JWT 浠ょ墝閰嶇疆
  secret: ""  # 鈿狅笍 蹇呴』閫氳繃 JWT_SECRET 鐜鍙橀噺璁剧疆锛岄暱搴﹁嚦灏?2浣?
  access_token_expire_hours: 24  # 璁块棶浠ょ墝鏈夋晥鏈燂紙灏忔椂锛?
  refresh_token_expire_days: 7   # 鍒锋柊浠ょ墝鏈夋晥鏈燂紙澶╋級

log:
  # 鏃ュ織閰嶇疆
  level: "info"  # debug, info, warn, error锛岀敓浜х幆澧冨缓璁?info 鎴?warn
  format: "json"  # json, text
  output: "stdout"  # stdout, file

upload:
  # 鏂囦欢涓婁紶閰嶇疆
  max_size: 10485760  # 10MB锛屾渶澶ф枃浠跺ぇ灏?
  allowed_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "application/pdf"
  storage_path: "./uploads"  # 涓婁紶鏂囦欢瀛樺偍璺緞

kafka:
  # Kafka 娑堟伅闃熷垪閰嶇疆
  enabled: false  # 寮€鍙戠幆澧冨彲绂佺敤锛岀敓浜х幆澧冨惎鐢?
  brokers:
    - "localhost:9092"
  client_id: "taskflow-backend"
  notification_group_id: "notification-consumer-group"
  audit_group_id: "audit-consumer-group"
  topics:
    notification:
      - "user-registered"
      - "task-created"
      - "task-updated"
      - "comment-added"
    audit:
      - "user-login"
      - "user-action"
      - "task-operation"
      - "file-upload"
  group_id: "taskflow-consumer-group"

# 閭欢閰嶇疆锛堥€氳繃鐜鍙橀噺璁剧疆锛?
# SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM

# 閫熺巼闄愬埗锛堥€氳繃鐜鍙橀噺璁剧疆锛?
# RATE_LIMIT_ENABLED, RATE_LIMIT_REQUESTS, RATE_LIMIT_WINDOW

# 鍔熻兘寮€鍏筹紙閫氳繃鐜鍙橀噺璁剧疆锛?
# FEATURE_NOTIFICATIONS_ENABLED, FEATURE_AUDIT_LOG_ENABLED 绛