# TaskFlow 后端配置

app:
  name: "TaskFlow"
  version: "1.0.0"
  env: "development"  # development, testing, production
  debug: true

server:
  port: 30088
  host: "127.0.0.1"
  read_timeout: 10
  write_timeout: 10
  idle_timeout: 60
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

database:
  host: "localhost"
  port: 3307
  name: "taskflow"
  user: "taskflow"
  password: "taskflow123"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300

redis:
  host: "localhost"
  port: 6379
  password: "redis123"
  db: 0
  pool_size: 10
  min_idle_conns: 2

jwt:
  secret: "your-super-secret-jwt-key-change-in-production"
  access_token_expire_hours: 24
  refresh_token_expire_days: 7

log:
  level: "info"  # debug, info, warn, error
  format: "json" # json, text
  output: "stdout"

upload:
  max_size: 10485760  # 10MB
  allowed_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "application/pdf"
  storage_path: "./uploads"

# Kafka配置
kafka:
  enabled: true
  brokers:
    - "localhost:9092"
  client_id: "taskflow-backend"
  notification_group_id: "notification-consumer-group"
  audit_group_id: "audit-consumer-group"
  topics:
    notification:
      - "user-registered"
      - "task-created"
      - "task-updated"
      - "comment-added"
    audit:
      - "user-login"
      - "user-action"
      - "task-operation"
      - "file-upload"
  group_id: "taskflow-consumer-group"